name: Build

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build tinyFire
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          swift --version

      - name: Inspect project
        run: xcodebuild -list -project tinyFire.xcodeproj

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project tinyFire.xcodeproj -scheme tinyFire

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project tinyFire.xcodeproj \
            -scheme tinyFire \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
